# PDF build of Rancher Manager. dsc-style-bundle/pdf/pdf.mk and
# dsc-style-bundle/pdf/antora-pdf.js read this file. Refer to
# dsc-style-bundle/pdf/README.md.
#
# mode:
#   none:        no PDF (the same as no file)
#   local:       make local-pdf builds the PDFs into build/pdf/. Pages do not
#                link to them.
#   deliverable: run make pdf first. Then make local and make remote add the
#                PDFs and a PDF link on each page.
mode: deliverable

# The product file: shared/modules/ROOT/partials/releases/<product>.yml.
# One product only.
product: rancher-manager

# latest (the newest version that is not a prerelease), all, or a list.
releases: latest

languages: [en]

# The site for web links in the PDFs: links to pages that are not in the PDF.
site_url: https://documentation.suse.com/cloudnative
